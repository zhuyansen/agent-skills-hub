name: Index watch

# Which of our pages Google has indexed, and how many days that took (ops/index/index_watch.py):
# reads the sitemaps of agentskillshub.top and jasonzhu.ai, takes pages with impressions as
# indexed, and spends the URL Inspection quota (2,000 a day per property) on the rest, new pages
# first. Writes index_pages and index_checks (migration 031). The log prints counts only.
# Shadow mode from 2026-10-28 for two weeks: it records and alerts nobody.
on:
  schedule:
    - cron: "41 1 * * *" # 09:41 Beijing, off the hour
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: index-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # the first pass inspects about 2,300 URLs at some 3 s each (measured 2026-10-27); later days a few hundred
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements.txt

      - run: pip install -r ops/requirements.txt

      - name: Write GSC token
        env:
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
        run: printf '%s' "$GSC_TOKEN_JSON" > ops/gsc/token.json

      - name: Watch
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ops/index/index_watch.py
