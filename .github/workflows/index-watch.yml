name: Index watch

# Which of our pages Google has indexed, and how many days that took (ops/index/index_watch.py):
# reads the sitemaps of agentskillshub.top, jasonzhu.ai and the sites in INDEX_WATCH_EXTRA_SITES, takes pages with impressions as
# indexed, and spends the URL Inspection quota (2,000 a day per property) on the rest, new pages
# first. Writes index_pages and index_checks (migration 031). The log prints counts only.
# Shadow mode from 2026-10-28 for two weeks: it records and alerts nobody.
on:
  schedule:
    - cron: "41 1 * * *" # 09:41 Beijing, off the hour
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: index-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # An inspection takes 6-11 s (2026-11-19/20) and sitemap-audit.xml doubled agentskillshub.top to ~9,600 URLs,
    # so two days ran into this timeout (2026-11-22/23). The script now inspects 4 at a time and stops starting
    # new ones after INDEX_WATCH_MINUTES; the pages it did not reach are first in line the next day.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements.txt

      - run: pip install -r ops/requirements.txt

      - name: Write GSC token
        env:
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
        run: printf '%s' "$GSC_TOKEN_JSON" > ops/gsc/token.json

      - name: Watch
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          INDEX_WATCH_EXTRA_SITES: ${{ secrets.INDEX_WATCH_EXTRA_SITES }} # sites not named in this repo; the log prints "extra site N"
          INDEX_WATCH_MINUTES: "140" # inspections stop starting here, leaving 40 of the 180 minutes for setup and the last saves
        run: python ops/index/index_watch.py
