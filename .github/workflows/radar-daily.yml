name: New-term radar

# Once a day: the terms that are starting to surge (ops/radar/radar.py). The cron is 01:00 UTC
# (09:00 Beijing), but Actions starts it about 4.5 hours late (05:13-05:39 UTC from 10-14 to
# 10-21), so the mail usually arrives around 13:30-14:30 Beijing.
#
# Mail: exactly one a day, to RADAR_EMAIL_TO (ops/radar/notify.py, Resend), and the run summary.
# It opens with what to build today, leaving out the picks the 8-hourly runs (radar-source.yml)
# already mailed since yesterday: their memory of what they mailed is read from their cache,
# restored read-only (--sent-picks). Then the evidence: the keyword table; ① the last day's
# source leads from radar_leads (X, Hugging Face, AI video trends, new apps), each listed once,
# never again after an earlier daily or a pick mail showed it; ② a new GitHub repo taking off
# on its own; ⑤ the review; the data status. The words new repos in the catalog share
# (② GitHub) are in shadow mode: kept in radar_leads for the review, one status line.
#
# Jev checks which leads are names of new things. Leads are kept in the table radar_leads
# (migration 026); 14 days later the run checks them in Google Trends (⑤, AIsa), and the mail
# names only the early hits (Trends rose a day or more after the radar saw the term) and gives
# each signal's counts. It writes only radar_leads; it never pushes to main.
#
# AIsa here: the review (up to 40 leads and 60 Trends tasks at $0.0012, at most $0.072 and about
# 10 minutes a day; ops/radar/review.py PER_DAY and REVIEW_CALLS_MAX) and the keyword table
# (about $0.15 a day, ops/radar/usecases.py). GitHub search is free.
#
# Yesterday's repo star counts and the leads the last dailies listed live in the Actions cache
# (one entry per run, restored by prefix), so the repo does not grow. A missing cache only means
# the run builds a new snapshot: no star gains that day, and ① may list a lead a second time.
#
# The cron's 01:00 UTC can overlap the 00:17 sync. The radar's database read is one indexed
# query with a 60 s timeout; if it fails, the report says so and nothing is retried.

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: radar-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # 9-12 minutes until 2026-10-21, plus up to 10 for the larger review
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ops/requirements.txt
            backend/requirements.txt

      - name: Install deps
        run: pip install -r ops/requirements.txt sqlalchemy "psycopg[binary]" psycopg2-binary markdown

      - name: Restore yesterday's snapshots
        uses: actions/cache/restore@v4
        with:
          path: radar-snap
          key: radar-snap-${{ github.run_id }}
          restore-keys: radar-snap-

      - name: Restore the 8-hourly runs' memory of the picks they mailed
        uses: actions/cache/restore@v4
        with:
          path: radar-src-snap
          key: radar-src-snap-read-by-daily   # never saved: the latest source run's entry, by prefix; read only
          restore-keys: radar-src-snap-

      - name: Run the radar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          GOANYAPI_API_KEY: ${{ secrets.GOANYAPI_API_KEY }}   # optional: related queries for the keyword table (usecases.py)
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python ops/radar/radar.py "$RUNNER_TEMP/radar.md" radar-snap --skip-x --skip-hf --skip-memes --skip-appstore
          --sent-picks=radar-src-snap/sent_picks.json

      - name: Save today's snapshots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: radar-snap
          key: radar-snap-${{ github.run_id }}

      - name: Report
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
        run: |
          [ -f "$RUNNER_TEMP/radar.md" ] || echo "## 新词雷达运行失败" > "$RUNNER_TEMP/radar.md"
          printf '\n[运行记录](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/radar.md"
          cat "$RUNNER_TEMP/radar.md" >> "$GITHUB_STEP_SUMMARY"
          python ops/radar/notify.py "$RUNNER_TEMP/radar.md" "新词雷达 · 日报 $(TZ=Asia/Shanghai date +%m-%d)"
