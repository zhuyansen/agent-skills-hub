name: New-term radar

# Once a day, 09:00 Beijing: the terms that are starting to surge, from three signals
# (ops/radar/radar.py): new GitHub repos in the catalog, pages competitors added to their
# sitemaps since yesterday, and GSC queries seen for the first time. Jev checks which are
# names of new things. The report goes to the run summary and the tracking issue
# "新词雷达日报". Read-only: it never pushes to main.
#
# Yesterday's competitor URLs live in the Actions cache (one entry per run, restored by
# prefix), so the repo does not grow. A missing cache only means the run builds a new
# snapshot and reports no competitor diff that day.
#
# 01:00 UTC can overlap the 00:00 sync. The radar's database read is one indexed query
# with a 60 s timeout; if it fails, the report says so and nothing is retried.

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: radar-daily
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ops/requirements.txt
            backend/requirements.txt

      - name: Install deps
        run: pip install -r ops/requirements.txt sqlalchemy psycopg2-binary

      - name: Restore yesterday's snapshots
        uses: actions/cache/restore@v4
        with:
          path: radar-snap
          key: radar-snap-${{ github.run_id }}
          restore-keys: radar-snap-

      - name: Write credentials
        env:
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
        run: printf '%s' "$GSC_TOKEN_JSON" > ops/gsc/token.json

      - name: Run the radar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python ops/radar/radar.py "$RUNNER_TEMP/radar.md" radar-snap

      - name: Save today's snapshots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: radar-snap
          key: radar-snap-${{ github.run_id }}

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/radar.md" ] || echo "## 新词雷达运行失败" > "$RUNNER_TEMP/radar.md"
          printf '\n[运行记录](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/radar.md"
          cat "$RUNNER_TEMP/radar.md" >> "$GITHUB_STEP_SUMMARY"
          issue=$(gh issue list --state open --search "新词雷达日报 in:title" --json number --jq '.[0].number')
          [ -n "$issue" ] || issue=$(gh issue create --title "新词雷达日报" --body "每天 09:00(北京时间)自动更新,见 .github/workflows/radar-daily.yml" | grep -o '[0-9]*$')
          gh issue comment "$issue" --body-file "$RUNNER_TEMP/radar.md"
