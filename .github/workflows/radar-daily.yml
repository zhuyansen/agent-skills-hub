name: New-term radar

# Once a day, 09:00 Beijing: the terms that are starting to surge (ops/radar/radar.py),
# earliest signal first: ① names the labs and AI bloggers posted on X (AIsa) and new
# models on Hugging Face's trending list; ② a new GitHub repo taking off on its own, and
# terms new repos in the catalog suddenly share; ③ pages competitors and LobeHub added
# to their sitemaps since yesterday; ④ GSC queries seen for the first time (fresh data).
# Jev checks which are names of new things. Leads are kept in the table radar_leads
# (migration 026); 14 days later the run checks them in Google Trends (⑤, AIsa) and the
# report ends with each signal's hit rate. The report goes to the run summary and the
# tracking issue "新词雷达日报". It writes only radar_leads; it never pushes to main.
#
# AIsa costs about $0.08 a day: 24 X accounts at $0.003, up to 15 Trends tasks at
# $0.0012. Without the AISA_API_KEY secret those two parts report an error and the rest
# runs as before.
#
# Yesterday's competitor URLs, the X vocabulary, HF's trending list and repo star counts
# live in the Actions cache (one entry per run, restored by
# prefix), so the repo does not grow. A missing cache only means the run builds a new
# snapshot and reports no competitor diff that day.
#
# 01:00 UTC can overlap the 00:00 sync. The radar's database read is one indexed query
# with a 60 s timeout; if it fails, the report says so and nothing is retried.

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: radar-daily
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ops/requirements.txt
            backend/requirements.txt

      - name: Install deps
        run: pip install -r ops/requirements.txt sqlalchemy "psycopg[binary]" psycopg2-binary

      - name: Restore yesterday's snapshots
        uses: actions/cache/restore@v4
        with:
          path: radar-snap
          key: radar-snap-${{ github.run_id }}
          restore-keys: radar-snap-

      - name: Write credentials
        env:
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
        run: printf '%s' "$GSC_TOKEN_JSON" > ops/gsc/token.json

      - name: Run the radar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python ops/radar/radar.py "$RUNNER_TEMP/radar.md" radar-snap

      - name: Save today's snapshots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: radar-snap
          key: radar-snap-${{ github.run_id }}

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/radar.md" ] || echo "## 新词雷达运行失败" > "$RUNNER_TEMP/radar.md"
          printf '\n[运行记录](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/radar.md"
          cat "$RUNNER_TEMP/radar.md" >> "$GITHUB_STEP_SUMMARY"
          issue=$(gh issue list --state open --search "新词雷达日报 in:title" --json number --jq '.[0].number')
          [ -n "$issue" ] || issue=$(gh issue create --title "新词雷达日报" --body "每天 09:00(北京时间)自动更新,见 .github/workflows/radar-daily.yml" | grep -o '[0-9]*$')
          gh issue comment "$issue" --body-file "$RUNNER_TEMP/radar.md"
