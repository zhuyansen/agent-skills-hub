name: New-term radar

# Once a day, 09:00 Beijing: the terms that are starting to surge (ops/radar/radar.py),
# earliest signal first: ① names the labs and AI bloggers posted on X and new models on
# Hugging Face's trending list, run apart every 8 hours (radar-source.yml) and listed
# here from radar_leads (new apps on the charts too: appstore.py runs there), with the AI video trends people recreate (TikTok, Instagram,
# YouTube Shorts, X, TikTok's trending hashtags; memes.py, also every 8 hours) and Jev's
# score for building a site or app for one now; ② a new GitHub repo taking off on its own, new apps climbing
# the App Store charts in eight countries with how crowded their search words already are
# and their Xiaohongshu and Douyin posts (appstore.py), and terms new repos in the
# catalog suddenly share; ③ on Mondays new sites (registered in the last 90
# days, already ranking; AIsa whois overview, about $0.26); ④ GSC queries seen for the
# first time (fresh data).
# Jev checks which are names of new things. Leads are kept in the table radar_leads
# (migration 026); 14 days later the run checks them in Google Trends (⑤, AIsa) and the
# report ends with each signal's hit rate. The report goes to the run summary and the
# mail to RADAR_EMAIL_TO (ops/radar/notify.py, Resend). It writes only radar_leads; it never pushes to main.
#
# AIsa here: the review (up to 40 leads and 60 Trends tasks at $0.0012, at most $0.072 and about
# 10 minutes a day; ops/radar/review.py PER_DAY and REVIEW_CALLS_MAX), the
# Xiaohongshu and Douyin searches for five new apps ($0.01 each, about $0.10 a day) and the
# Monday new-site queries (about $0.26 a week). The App Store charts and search are free.
#
# Yesterday's repo star counts live in the Actions cache (one entry per run, restored by
# prefix), so the repo does not grow. A missing cache only means the run builds a new
# snapshot and reports no star gains that day.
#
# 01:00 UTC can overlap the 00:00 sync. The radar's database read is one indexed query
# with a 60 s timeout; if it fails, the report says so and nothing is retried.

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: radar-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # 9-12 minutes until 2026-10-21, plus up to 10 for the larger review
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ops/requirements.txt
            backend/requirements.txt

      - name: Install deps
        run: pip install -r ops/requirements.txt sqlalchemy "psycopg[binary]" psycopg2-binary markdown

      - name: Restore yesterday's snapshots
        uses: actions/cache/restore@v4
        with:
          path: radar-snap
          key: radar-snap-${{ github.run_id }}
          restore-keys: radar-snap-

      - name: Write credentials
        env:
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
        run: printf '%s' "$GSC_TOKEN_JSON" > ops/gsc/token.json

      - name: Run the radar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          GOANYAPI_API_KEY: ${{ secrets.GOANYAPI_API_KEY }}   # optional: related queries for the keyword table (usecases.py)
          GITHUB_TOKEN: ${{ github.token }}
        run: python ops/radar/radar.py "$RUNNER_TEMP/radar.md" radar-snap --skip-x --skip-hf --skip-memes --skip-appstore

      - name: Save today's snapshots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: radar-snap
          key: radar-snap-${{ github.run_id }}

      - name: Report
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
        run: |
          [ -f "$RUNNER_TEMP/radar.md" ] || echo "## 新词雷达运行失败" > "$RUNNER_TEMP/radar.md"
          printf '\n[运行记录](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/radar.md"
          cat "$RUNNER_TEMP/radar.md" >> "$GITHUB_STEP_SUMMARY"
          python ops/radar/notify.py "$RUNNER_TEMP/radar.md" "新词雷达 · 日报 $(TZ=Asia/Shanghai date +%m-%d)"
