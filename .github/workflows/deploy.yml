name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Sync Skills Data"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ignore_running_sync:
        description: "Build now even if a sync is running (both slow down; the build can fail)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # the build waits for a running sync

jobs:
  build:
    # A failed sync can leave grades half-written; don't publish that. Pushes
    # and manual runs always build.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Concurrency lives on the jobs, not the workflow (10-05): at workflow level a run
    # whose build is skipped (a sync that did not succeed) still joined the group and
    # cancelled the deploy in progress, so nothing shipped (three times on 10-03/05).
    # A skipped job never joins.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Wait for a running sync
        # The build reads the catalog from Supabase seven times and the READMEs twice (~40 min).
        # Next to a sync's writes that saturates the database: on 2026-10-24 from 14:32 to 14:46
        # the sync's score writes and this build's README reads all hit statement_timeout
        # (57014), and the build failed. A run the sync triggered (workflow_run) starts after
        # it, so only pushes and manual runs wait. When the sync succeeds, the deploy it
        # triggers cancels this one (same pages-build group) and ships this commit too.
        if: github.event_name != 'workflow_run' && !inputs.ignore_running_sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # sync.yml's job limit is 180 minutes; past 200 something is stuck, so build anyway.
          give_up_at=$(( $(date +%s) + 200 * 60 ))
          while :; do
            if ! active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sync.yml --limit 5 \
                --json status --jq '[.[] | select(.status != "completed")] | length'); then
              echo "::warning::Could not list sync runs; building without waiting."
              exit 0
            fi
            if [ "$active" -eq 0 ]; then
              echo "No sync queued or running; building."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$give_up_at" ]; then
              echo "::warning::A sync has been queued or running for over 200 minutes; building anyway."
              exit 0
            fi
            echo "A sync is queued or running; checking again in 60 s."
            sleep 60
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Create IndexNow key verification file
        run: |
          INDEXNOW_KEY="a52f1d0890354e5b84d0e4e1ba17bd84"
          echo "$INDEXNOW_KEY" > dist/${INDEXNOW_KEY}.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-search-engines:
    # IndexNow (Bing, Yandex, Naver and the other engines that share its submissions) hears only
    # about URLs added, re-dated or dropped since the last run: the live sitemaps are compared
    # with the snapshot that run kept in the Actions cache (frontend/scripts/indexnow-changes.mjs).
    # Until 2026-11-01 each deploy sent every URL twice and to three endpoints (~4,500 URLs, 3+
    # deploys a day), and Bing asks for the URLs that changed. The build no longer sends anything.
    runs-on: ubuntu-latest
    needs: deploy
    concurrency:
      group: indexnow
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: frontend/scripts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore the last run's sitemap snapshot
        uses: actions/cache/restore@v4
        with:
          path: indexnow-snap
          key: indexnow-snap-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-snap-

      - name: Find the URLs that changed
        id: changes
        run: |
          mkdir -p indexnow-snap
          # A sitemap that cannot be read sends nothing and keeps the old snapshot, so the next
          # deploy's comparison still covers these changes.
          if node frontend/scripts/indexnow-changes.mjs indexnow-snap/snapshot.json urls.txt; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::IndexNow: the live sitemaps could not be read, nothing was sent"
          fi

      - name: Submit to IndexNow
        id: submit
        if: steps.changes.outputs.ready == 'true'
        run: |
          INDEXNOW_KEY="a52f1d0890354e5b84d0e4e1ba17bd84"
          HOST="agentskillshub.top"

          URL_COUNT=$(wc -l < urls.txt | tr -d ' ')
          if [ "$URL_COUNT" -eq 0 ]; then
            echo "No URL changed since the last run; nothing to send."
            echo "delivered=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qv "^https://${HOST}/" urls.txt; then
            echo "::error::URLs that are not on https://${HOST}/ (first: $(grep -v "^https://${HOST}/" urls.txt | head -1))"
            exit 1
          fi
          echo "Sending $URL_COUNT changed URLs in batches of 2000 (the protocol allows 10,000)"
          split -l 2000 urls.txt batch-

          # One endpoint per batch: IndexNow shares a submission with every engine that takes part,
          # so sending the same URL to several endpoints only repeats it. Bing's own endpoint is the
          # fallback when api.indexnow.org cannot be reached. A batch that reaches neither keeps the
          # snapshot unsaved, so the next deploy sends these URLs again. A rejection (4xx) is ours to
          # fix and fails the step: every batch was once answered 422 while the step stayed green
          # (2026-10-11).
          send() {
            curl -s --max-time 60 -o /tmp/indexnow_response.txt -w "%{http_code}" -X POST "$1" \
              -H "Content-Type: application/json; charset=utf-8" -d @"$2" || true
          }
          REJECTED=0
          DELIVERED=true
          BATCH=0
          for file in batch-*; do
            BATCH=$((BATCH+1))
            jq -R -s --arg host "$HOST" --arg key "$INDEXNOW_KEY" \
              '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: (split("\n") | map(select(length > 0)))}' \
              "$file" > /tmp/indexnow_payload.json
            name="IndexNow"
            code=$(send "https://api.indexnow.org/indexnow" /tmp/indexnow_payload.json)
            case "${code:-000}" in
              000|5*) name="Bing (fallback)"; code=$(send "https://www.bing.com/indexnow" /tmp/indexnow_payload.json) ;;
            esac
            code=${code:-000}
            echo "Batch $BATCH: $(wc -l < "$file" | tr -d ' ') URLs, $name answered HTTP $code"
            case "$code" in
              2*) ;;
              4*) echo "::error::IndexNow: $name rejected batch $BATCH with HTTP $code: $(head -c 300 /tmp/indexnow_response.txt)"; REJECTED=1 ;;
              *) echo "::warning::IndexNow: batch $BATCH was not delivered ($name HTTP $code); the next deploy sends it again"; DELIVERED=false ;;
            esac
          done

          echo "delivered=$DELIVERED" >> "$GITHUB_OUTPUT"
          if [ "$REJECTED" -ne 0 ]; then
            echo "A search engine rejected a batch: see the errors above."
            exit 1
          fi
          if [ "$DELIVERED" = true ]; then
            echo "IndexNow submission complete."
          else
            echo "Not every batch was delivered; the next deploy sends these changes again."
          fi

      - name: Save the snapshot for the next run
        if: steps.submit.outputs.delivered == 'true'
        uses: actions/cache/save@v4
        with:
          path: indexnow-snap
          key: indexnow-snap-${{ github.run_id }}-${{ github.run_attempt }}
