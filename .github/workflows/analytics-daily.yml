name: Analytics Daily Sweep

# Runs the four-tool analytics sweep (GSC / GA / Plausible / Clarity) once a
# day and writes a markdown digest to the run's Step Summary. Cloud-native:
# no dependency on a local machine or the Clash proxy (GitHub runners are
# outside China, so googleapis is reached directly). Does NOT push to main,
# so it never triggers the deploy workflow. Raw JSON is uploaded as an
# artifact for deeper review.
#
# GSC data lags ~2 days and Clarity caps at 10 API calls/day, so once daily is
# the right cadence — running more often gains nothing.

on:
  schedule:
    # 20:20 UTC = 04:20 Beijing. GitHub has been starting every scheduled run in
    # this repo 4.5-7 h late (10-21..27): the old 00:20 slot mailed at ~13:00
    # Beijing. From 20:20 a typical day lands ~09:00. The lead check counts from
    # the previous run, so moving this time loses no lead.
    - cron: "20 20 * * *"
  workflow_dispatch: {} # manual "Run workflow" button for testing

permissions:
  contents: read
  actions: read # the lead check reads when the previous digest ran

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements.txt

      - name: Install dependencies
        run: pip install -r ops/requirements.txt

      - name: Write credentials from secrets
        env:
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
          GA_ADC_JSON: ${{ secrets.GA_ADC_JSON }}
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: |
          printf '%s' "$GSC_TOKEN_JSON" > ops/gsc/token.json
          printf '%s' "$GA_ADC_JSON" > ops/ga/adc.json
          printf '%s' "$PLAUSIBLE_API_KEY" > ops/plausible/.api_key
          printf '%s' "$CLARITY_API_TOKEN" > ops/clarity/.api_token

      # No proxy env set: requests/AuthorizedSession reach googleapis directly.
      # `|| true` so one failing source (e.g. Clarity daily-limit) still lets
      # the rest run and a partial digest be produced.
      - name: GSC
        run: |
          python ops/gsc/fetch_gsc.py queries --days 90 || true
          python ops/gsc/fetch_gsc.py compare --days 28 || true
          python ops/gsc/fetch_gsc.py brand --days 90 || true

      - name: Google Analytics
        run: python ops/ga/fetch_ga.py dump --days 28 || true

      - name: Plausible
        run: python ops/plausible/fetch_plausible.py dump || true

      - name: Clarity
        run: python ops/clarity/fetch_clarity.py dump || true

      - name: Build digest → Step Summary
        run: |
          python ops/analytics_digest.py > digest.md
          cat digest.md >> "$GITHUB_STEP_SUMMARY"

      # Yesterday's enterprise leads, for the email only. This repo is public, so
      # the Step Summary, the log and the artifact are readable by anyone: the
      # list stays in RUNNER_TEMP (outside the upload path) and the log gets a
      # count. A failed query writes a warning that the email's subject carries.
      - name: New leads (email only)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GH_TOKEN: ${{ github.token }}
        # From where the last mailed digest started (a failed run mailed nothing, so it
        # does not count); if that lookup fails, new_leads.py looks back one day.
        run: |
          since=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow analytics-daily.yml --status success \
                    --limit 1 --json createdAt -q '.[0].createdAt // ""' || true)
          python ops/new_leads.py "$RUNNER_TEMP/leads.md" ${since:+--since "$since"} || true

      # Deliver, don't just display: a digest that sits in the Actions tab is a
      # dashboard nobody opens. Email it to the operator every morning.
      - name: Email digest (Resend)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python ops/send_digest_email.py digest.md "$RUNNER_TEMP/leads.md"

      - name: Upload raw JSON
        uses: actions/upload-artifact@v4
        with:
          name: analytics-out-${{ github.run_id }}
          path: ops/*/out/*.json
          retention-days: 30
          if-no-files-found: warn
