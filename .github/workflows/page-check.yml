name: Scenario page check

# On-page check of the scenario pages (ops/seo/page_check.py), our own version of 哥飞's
# On Page audit: title length, keyword in title/H1/description, the core keyword's place in
# the word-frequency list, word count, HTML size, structured data. Free; the report links
# each page to 哥飞's audit for the full score.
#
# After a deploy that a push triggered: the pages whose scenario entries changed since the
# previous push deploy (all live pages when the generator or a shared file changed). The
# deploys after each sync rebuild the same code, so they are skipped. Sundays 10:00 Beijing:
# every live page. A report goes by mail to RADAR_EMAIL_TO only when pages were checked.

on:
  workflow_run:
    workflows: ["Deploy Frontend to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      slugs:
        description: "逗号分隔的页面 slug(留空 = 全部在线页面)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: page-check
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements.txt

      - name: Install deps
        run: pip install -r ops/requirements.txt markdown

      - name: Write credentials
        env:
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
        run: printf '%s' "$GSC_TOKEN_JSON" > ops/gsc/token.json

      - name: Check pages
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SLUGS: ${{ github.event.inputs.slugs }}
        run: |
          out="$RUNNER_TEMP/pages.md"
          case "$EVENT" in
            workflow_run)
              base=$(gh run list --workflow deploy.yml --event push --status success -L 20 \
                     --json headSha -q "[.[] | select(.headSha != \"$HEAD_SHA\")][0].headSha")
              [ -n "$base" ] || { echo "no earlier push deploy to compare with"; exit 0; }
              sleep 60   # GitHub Pages serves the new build within about a minute
              python ops/seo/page_check.py "$out" --changed "$base" "$HEAD_SHA" ;;
            workflow_dispatch)
              if [ -n "$SLUGS" ]; then python ops/seo/page_check.py "$out" --slugs "$SLUGS"
              else python ops/seo/page_check.py "$out" --all; fi ;;
            *)
              python ops/seo/page_check.py "$out" --all ;;
          esac

      - name: Report
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
        run: |
          [ -f "$RUNNER_TEMP/pages.md" ] || exit 0
          printf '\n[运行记录](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/pages.md"
          cat "$RUNNER_TEMP/pages.md" >> "$GITHUB_STEP_SUMMARY"
          python ops/radar/notify.py "$RUNNER_TEMP/pages.md" "场景页体检 $(TZ=Asia/Shanghai date +%m-%d)"
