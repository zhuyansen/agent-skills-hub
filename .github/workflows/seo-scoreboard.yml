name: SEO Scoreboard Weekly

# Adds last week's Search Console row to ops/seo-scoreboard.md. Thursday, so the
# week's Sunday has final data (GSC finalises about three days later).
on:
  schedule:
    - cron: "53 2 * * 4" # Thursdays 10:53 Beijing, off the hour
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: seo-scoreboard
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements.txt

      - run: pip install -r ops/requirements.txt

      - name: Write GSC token
        env:
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
        run: printf '%s' "$GSC_TOKEN_JSON" > ops/gsc/token.json

      - name: Fill missing weeks
        run: python ops/seo_scoreboard.py

      - name: Commit
        run: |
          git diff --quiet ops/seo-scoreboard.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/seo-scoreboard.md
          git commit -m "ops(seo): scoreboard week row [skip ci]"
          git pull --rebase
          git push
