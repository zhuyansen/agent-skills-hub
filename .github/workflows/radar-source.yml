name: New-term radar · sources

# The radar's source signals (①), three times a day, 08:00 / 16:00 / 24:00 Beijing:
# names the labs and AI bloggers in ops/radar/sources.json posted on X (AIsa), and models
# new to Hugging Face's trending top 50, and AI video trends people recreate (TikTok,
# Instagram, YouTube Shorts, X, TikTok's trending hashtags; memes.py) with Jev's score for
# building a site or app for one now, and new apps on the App Store, Mac and Google Play
# charts of 30 storefronts (appstore.py: Apple's RSS and Apolu), and new sites two or more
# people link in those X posts and in popular Bluesky posts (social_sites.py; shadow mode:
# recorded in radar_leads for the review, shown only as one status line). Sources move by the hour; a daily run would hold
# a 9:30 post for a day. The 08:00 run lands an hour before radar-daily.yml, whose report
# lists the ① leads of the last day.
#
# A run mails RADAR_EMAIL_TO only when it found a name or hit an error.
# Leads go to radar_leads like the daily ones, and are reviewed the same way.
#
# AIsa: X is read about once a day, by the first run 20 hours or more after the last read
# (source_signals.X_EVERY_HOURS): 35 accounts at $0.003, about $0.105 a day; the trend searches about
# $0.011 a run, $0.03 a day, plus one model call and Jev; for up to five new trends a run,
# the comments under their top TikTok videos and Google's top 10 (meme_checks.py, about $0.02 a run); Xiaohongshu and Douyin for three new
# apps a run, about $0.06 a run, $0.18 a day. The charts are free (about 3 minutes a run). The new sites' Bluesky
# search, t.co expansions and RDAP lookups are free; GoAnyAPI tags at most 10 of them a run with where their visits
# come from ($0.002 each, at most $0.06 a day). The X vocabulary and HF's
# list live in their own cache prefix (radar-src-snap-), apart from the daily snapshots.

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

concurrency:
  group: radar-source
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ops/requirements.txt
            backend/requirements.txt

      - name: Install deps
        run: pip install -r ops/requirements.txt sqlalchemy "psycopg[binary]" psycopg2-binary markdown

      - name: Restore the last run's vocabulary
        uses: actions/cache/restore@v4
        with:
          path: radar-src-snap
          key: radar-src-snap-${{ github.run_id }}
          restore-keys: radar-src-snap-

      - name: Run the source signals
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          GOANYAPI_API_KEY: ${{ secrets.GOANYAPI_API_KEY }}   # optional: where the new sites' visits come from (social_sites.py)
        run: python ops/radar/radar.py "$RUNNER_TEMP/sources.md" radar-src-snap --sources

      - name: Report
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
        run: |
          # the full report and any error go to the run's summary only
          if [ -f "$RUNNER_TEMP/sources.md" ]; then cat "$RUNNER_TEMP/sources.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ job.status }}" = "success" ]; then echo "没有新名字" >> "$GITHUB_STEP_SUMMARY"
          else echo "## 新词雷达 · ① 源头运行失败(不发邮件,见日志)" >> "$GITHUB_STEP_SUMMARY"; fi
          # the mail: only the picks no earlier mail sent (radar.mail_new_picks); no new pick, no mail
          mail="$RUNNER_TEMP/sources.picks.md"
          [ -f "$mail" ] || { echo "没有新的可做词,不发邮件" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          printf '\n[运行记录](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$mail"
          python ops/radar/notify.py "$mail" "新词雷达 · 现在就能做 $(TZ=Asia/Shanghai date +'%m-%d %H:%M')"
          # sent: these picks are not mailed again; when the mail fails this is skipped and the next run tries again
          mv radar-src-snap/sent_picks.next.json radar-src-snap/sent_picks.json

      - name: Save the vocabulary
        if: always()
        uses: actions/cache/save@v4
        with:
          path: radar-src-snap
          key: radar-src-snap-${{ github.run_id }}
