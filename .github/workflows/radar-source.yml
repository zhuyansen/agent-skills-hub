name: New-term radar · sources

# The radar's source signals (①), three times a day. The cron is 00:00 / 08:00 / 16:00 UTC
# (08:00 / 16:00 / 24:00 Beijing); Actions starts them about 2 to 5 hours late (10-14..10-21:
# about 02:00, 12:00-13:10 and 18:00-19:50 UTC). Each run reads models new to Hugging Face's
# trending top 50; AI video trends people recreate (TikTok, Instagram, YouTube Shorts, X,
# TikTok's trending hashtags; memes.py) with Jev's score for building a site or app for one now;
# new apps on the App Store, Mac and Google Play charts of 30 storefronts (appstore.py: Apple's
# RSS and Apolu); and new sites two or more people link in X posts and popular Bluesky posts
# (social_sites.py; shadow mode: recorded in radar_leads for the review, one status line).
# X, the names the labs and AI bloggers in ops/radar/sources.json post, is read about once a
# day: by the first run 20 hours or more after the last read (source_signals.X_EVERY_HOURS).
#
# Mail: only when a run finds a pick ("现在就能做": a trend or app worth building for now) that
# no earlier run mailed. The mail holds those picks, each with one link, and the run's link,
# nothing else. Their memory (sent_picks.json in the cache, 14 days) is updated only once the
# mail is sent, so a mail that failed is tried again by the next run. Errors and the full
# report go to the run summary only. Leads go to radar_leads like the daily ones and are
# reviewed the same way; the daily mail (radar-daily.yml) lists them once, and leaves out the
# picks mailed here.
#
# AIsa: X once a day, 35 accounts at $0.003, about $0.105 a day; the trend searches about
# $0.011 a run, $0.03 a day, plus one model call and Jev; for up to five new trends a run, the
# comments under their top TikTok videos and Google's top 10 (meme_checks.py, about $0.02 a
# run); Xiaohongshu and Douyin for three new apps a run, about $0.06 a run, $0.18 a day. The
# charts are free (about 3 minutes and 190 Apolu pages a run). The new sites' Bluesky search,
# t.co expansions and RDAP lookups are free; GoAnyAPI tags at most 10 of them a run with where
# their visits come from ($0.002 each, at most $0.06 a day). The X vocabulary, HF's list and
# the mailed picks live in their own cache prefix (radar-src-snap-), apart from the daily
# snapshots.

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

concurrency:
  group: radar-source
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ops/requirements.txt
            backend/requirements.txt

      - name: Install deps
        run: pip install -r ops/requirements.txt sqlalchemy "psycopg[binary]" psycopg2-binary markdown

      - name: Restore the last run's vocabulary
        uses: actions/cache/restore@v4
        with:
          path: radar-src-snap
          key: radar-src-snap-${{ github.run_id }}
          restore-keys: radar-src-snap-

      - name: Run the source signals
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          GOANYAPI_API_KEY: ${{ secrets.GOANYAPI_API_KEY }}   # optional: where the new sites' visits come from (social_sites.py)
        run: python ops/radar/radar.py "$RUNNER_TEMP/sources.md" radar-src-snap --sources

      - name: Report
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
        run: |
          # the full report and any error go to the run's summary only
          if [ -f "$RUNNER_TEMP/sources.md" ]; then cat "$RUNNER_TEMP/sources.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ job.status }}" = "success" ]; then echo "没有新名字" >> "$GITHUB_STEP_SUMMARY"
          else echo "## 新词雷达 · ① 源头运行失败(不发邮件,见日志)" >> "$GITHUB_STEP_SUMMARY"; fi
          # the mail: only the picks no earlier mail sent (radar.mail_new_picks); no new pick, no mail
          mail="$RUNNER_TEMP/sources.picks.md"
          [ -f "$mail" ] || { echo "没有新的可做词,不发邮件" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          printf '\n[运行记录](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$mail"
          python ops/radar/notify.py "$mail" "新词雷达 · 现在就能做 $(TZ=Asia/Shanghai date +'%m-%d %H:%M')"
          # sent: these picks are not mailed again; when the mail fails this is skipped and the next run tries again
          mv radar-src-snap/sent_picks.next.json radar-src-snap/sent_picks.json

      - name: Save the vocabulary
        if: always()
        uses: actions/cache/save@v4
        with:
          path: radar-src-snap
          key: radar-src-snap-${{ github.run_id }}
